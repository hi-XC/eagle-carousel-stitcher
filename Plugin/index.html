<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轮播拼接</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><header class="header"><div class="identity"><img src="assets/mark.png" class="mark" alt=""><span>轮播拼接</span></div><div class="header-actions"><button class="icon-button" id="pin" aria-label="窗口置顶" title="窗口置顶"><img src="assets/pin.svg" alt=""></button><button class="icon-button" id="close" aria-label="关闭" title="关闭"><img src="assets/close.svg" alt=""></button></div></header>
<main><div class="workspace"><div class="section-head"><h1>拼接预览</h1><div class="segment" role="group" aria-label="拼接方向"><button id="horizontal" class="active" aria-pressed="true">横向</button><button id="vertical" aria-pressed="false">纵向</button></div></div><div id="dropZone" class="preview-card"><div id="imageLoading" class="image-loading hidden" aria-hidden="true"><img src="assets/spinner-20.svg" class="spinner" alt=""><span>正在加载素材</span></div><div id="preview" class="preview"><div class="empty"><span id="dropTitle">在 Eagle 中选中图片或视频，或将素材拖到这里。</span><button id="readSelection" class="secondary">读取 Eagle 选区</button></div></div><div id="videoPreviewHint" class="video-preview-hint hidden">视频预览显示首帧</div><div class="preview-controls hidden" id="previewControls"><label id="overlapLabel" class="overlap-label"><span id="overlapText">重叠</span><input id="overlap" type="number" min="0" step="1" value="0" aria-label="重叠像素"><span>px</span></label><span id="size" class="dimension">—</span><select id="zoom" aria-label="预览缩放"><option value="fit">适合窗口</option><option value="1">100%</option><option value="2">200%</option></select></div></div><div class="image-strip hidden" id="strip"><div id="items" class="items"></div><div class="strip-actions"><button id="addSelection" class="add-image" aria-label="追加 Eagle 当前选中素材" title="追加 Eagle 当前选中素材"><img src="assets/add.svg" alt=""></button><button id="clearSelection" class="add-image" aria-label="清空当前选择" title="清空当前选择"><img src="assets/trash.svg" alt=""></button></div></div><p id="dropHint" class="visually-hidden"></p></div>
<aside><h2>保存到 Eagle</h2><div id="statusToast" class="status-toast hidden"><p id="status" role="status" aria-live="polite"></p><button id="dismissStatus" class="icon-button" aria-label="关闭提示" title="关闭提示"><img src="assets/close.svg" alt=""></button></div><div class="fields"><label class="visually-hidden" for="name">名称</label><textarea id="name" rows="2" placeholder="名称"></textarea><label class="visually-hidden" for="annotation">备注</label><textarea id="annotation" rows="4" placeholder="备注"></textarea><div id="annotations" class="candidates"></div><label class="visually-hidden" for="url">来源链接</label><input id="url" type="url" list="urlOptions" placeholder="来源链接"><datalist id="urlOptions"></datalist><div class="divider"></div><div class="field-head"><span>标签</span></div><div class="choice-line"><div id="tags" class="selected-values"></div><button id="openTags" class="choice-button" aria-label="选择标签" title="选择标签" disabled><img src="assets/add.svg" alt=""><span>选择标签</span></button></div><div class="divider"></div><div class="field-head"><span>文件夹</span></div><div class="choice-line"><div id="folders" class="selected-values"></div><button id="openFolders" class="choice-button" aria-label="选择文件夹" title="选择文件夹" disabled><img src="assets/add.svg" alt=""><span>选择文件夹</span></button></div><label id="folderConfirmLabel" class="confirm hidden"><input id="folderConfirm" type="checkbox">原素材文件夹不同，已确认目标位置</label><div class="divider"></div><label class="visually-hidden" for="rating">评分</label><select id="rating"><option value="" disabled>请选择评分</option><option value="0">无评分</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div><div id="audioSection" class="audio-section hidden"><label for="audioSource">声音</label><select id="audioSource" aria-label="声音"><option value="">静音</option></select></div><div class="save-area"><button id="save" class="primary" disabled><span class="save-label">拼接并导入</span><img class="save-spinner spinner" src="assets/spinner-16.svg" alt=""></button></div></aside></main><div id="progressAnnouncement" class="visually-hidden" role="status" aria-live="polite"></div></div>
<div id="clearDialog" class="picker-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="clearTitle" aria-describedby="clearDescription"><div class="confirm-dialog"><h2 id="clearTitle">清空当前选择？</h2><p id="clearDescription">清空插件中的素材和编辑信息，Eagle 中的原素材不会被删除。</p><div class="confirm-actions"><button id="cancelClear" class="secondary">取消</button><button id="confirmClear" class="primary">清空选择</button></div></div></div>
<div id="picker" class="picker-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pickerTitle"><div class="picker-dialog"><div class="picker-header"><div class="identity"><img src="assets/mark.png" class="mark" alt=""><span>轮播拼接</span></div><button id="pickerClose" class="icon-button" aria-label="关闭" title="关闭"><img src="assets/close.svg" alt=""></button></div><div class="picker-content"><label id="pickerTitle" for="pickerSearch">选择标签</label><div class="picker-search"><img src="assets/search.svg" alt=""><input id="pickerSearch" type="search" placeholder="搜索" aria-label="搜索"></div><div class="picker-toolbar"><span id="pickerCount" class="badge"></span><button id="pickerSelectedOnly" class="text-button">取消全选</button></div><div class="picker-list-wrap"><div id="pickerList" class="picker-list"></div><button id="pickerMore" class="text-button hidden">显示更多</button></div><div class="picker-footer"><span id="pickerSelectionCount"></span><button id="pickerDone" class="primary">完成</button></div></div></div></div>
<script>window.addEventListener('error',function(e){var s=document.getElementById('status');var zh=/^zh(?:[-_]cn)?$/i.test(new URLSearchParams(location.search).get('locale')||'');s.textContent=zh?'插件启动失败：'+(e.message||'未知错误'):'Plugin failed to start: '+(e.message||'Unknown error');s.className='error';document.getElementById('statusToast').classList.remove('hidden');});</script><script src="dist/app.js"></script></body></html>
